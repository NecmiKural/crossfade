name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage

  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: crossfade
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: crossfade_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U crossfade"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://crossfade:ci-only@127.0.0.1:5432/crossfade_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db

  envoy-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/envoy-validate.sh envoy/fixtures/*.json

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Plant a throwaway .env that must not reach the image
        run: echo "SHOULD_NOT_SHIP=1" > .env
      - run: docker build -t crossfade:ci .
      - name: Image invariants (no .env files, runs as node, secrets dir owned by node)
        run: |
          found=$(docker run --rm --user root --entrypoint sh crossfade:ci -c 'find / -xdev -name ".env*" -not -path "/proc/*" 2>/dev/null || true')
          if [ -n "$found" ]; then
            echo "::error::.env files found in the image: $found"
            exit 1
          fi
          docker run --rm --entrypoint sh crossfade:ci -c '[ "$(id -un)" = node ] && [ "$(stat -c %U /run/crossfade)" = node ]'
