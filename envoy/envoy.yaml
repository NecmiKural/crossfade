# Crossfade edge bootstrap (direct exposure). envoy.behind-proxy.yaml differs by exactly one line.
# __XDS_TOKEN__ is replaced by envoy/entrypoint.sh at start, so the token stays off the command line.
node:
  id: edge-1
  cluster: crossfade-edge
  metadata:
    xds_token: "__XDS_TOKEN__"
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
overload_manager:
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 10000
dynamic_resources:
  cds_config:
    api_config_source:
      api_type: REST
      transport_api_version: V3
      cluster_names: [control-plane]
      refresh_delay: 2s
      request_timeout: 5s
static_resources:
  clusters:
    # REST xDS polls go here with Host: control-plane.
    - name: control-plane
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: control-plane
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: web, port_value: 3000 } } }
    - name: envoy-admin
      type: STATIC
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: envoy-admin
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 9901 } } }
  listeners:
    - name: edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      per_connection_buffer_limit_bytes: 32768
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                use_remote_address: true
                normalize_path: true
                merge_slashes: true
                strip_any_host_port: true
                request_headers_timeout: 10s
                common_http_protocol_options:
                  headers_with_underscores_action: REJECT_REQUEST
                http2_protocol_options:
                  max_concurrent_streams: 100
                  initial_stream_window_size: 65536
                  initial_connection_window_size: 1048576
                upgrade_configs:
                  - upgrade_type: websocket
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%PATH(NQ)%"
                          status: "%RESPONSE_CODE%"
                          flags: "%RESPONSE_FLAGS%"
                          route: "%ROUTE_NAME%"
                          cluster: "%UPSTREAM_CLUSTER%"
                          duration_ms: "%DURATION%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                rds:
                  route_config_name: edge
                  config_source:
                    api_config_source:
                      api_type: REST
                      transport_api_version: V3
                      cluster_names: [control-plane]
                      refresh_delay: 2s
                      request_timeout: 5s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    # Not published. The engine reads per-cluster counters here with the platform token;
    # anything else (other paths, methods, or upstream containers without the token) gets a 404.
    - name: stats
      address:
        socket_address: { address: 0.0.0.0, port_value: 9902 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: stats
                route_config:
                  name: stats
                  virtual_hosts:
                    - name: stats
                      domains: ["*"]
                      routes:
                        - match:
                            path: /stats
                            headers:
                              - name: ":method"
                                string_match: { exact: GET }
                              - name: x-crossfade-stats
                                string_match: { exact: "__XDS_TOKEN__" }
                          route: { cluster: envoy-admin }
                        - match: { prefix: / }
                          direct_response: { status: 404 }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
