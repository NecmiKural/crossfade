name: crossfade

# One golden image, several roles (ADR-0002). Secrets live in the `secrets` volume, written once by `init`.
x-golden: &golden
  image: crossfade:local
  build: .
  volumes:
    - secrets:/run/crossfade:ro
  environment:
    DATABASE_URL: postgres://crossfade@db:5432/crossfade
    DATABASE_PASSWORD_FILE: /run/crossfade/pg_password
    XDS_TOKEN_FILE: /run/crossfade/xds_token

services:
  init:
    <<: *golden
    network_mode: none
    volumes:
      - secrets:/run/crossfade
    command:
      - sh
      - -c
      - umask 077; cd /run/crossfade && for f in pg_password xds_token; do [ -s $$f ] || head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > $$f; done

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: crossfade
      POSTGRES_DB: crossfade
      POSTGRES_PASSWORD_FILE: /run/crossfade/pg_password
    volumes:
      - db-data:/var/lib/postgresql
      - secrets:/run/crossfade:ro
    networks: [data]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # -h 127.0.0.1 so the check fails while the entrypoint's socket-only bootstrap server is running.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "crossfade", "-d", "crossfade"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    <<: *golden
    command: ["node", "dist/migrate.mjs"]
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *golden
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:3000:3000"
    networks: [data, control]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  envoy:
    image: crossfade-envoy:local
    build: ./envoy
    # The wrapper runs as root to read the token, then the image entrypoint drops to the envoy user.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /docker-entrypoint.sh envoy -c /etc/envoy/${ENVOY_BOOTSTRAP:-envoy.yaml} --config-yaml "node: {metadata: {xds_token: $$(cat /run/crossfade/xds_token)}}"'
    volumes:
      - secrets:/run/crossfade:ro
    ports:
      - "8080:8080"
    networks: [control, apps]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

networks:
  # data: db and the platform; control: platform and Envoy; apps: Envoy and your upstreams.
  data: {}
  control: {}
  apps:
    name: crossfade_apps

volumes:
  secrets: {}
  db-data: {}
